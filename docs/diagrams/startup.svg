<svg xmlns="http://www.w3.org/2000/svg" width="560" height="356" viewBox="0 38 560 356" role="img" aria-labelledby="title desc">
<title id="title">Starting up</title>
<desc id="desc">After docker compose up, the api and worker wait until postgres is ready, checking every 5 seconds. The api then runs the SQL migrations under an advisory lock and serves /api. The worker then tries to take its lock. If another worker holds it, it exits. Otherwise it resumes any imports a restart cut off and enters the worker loop.</desc>
<style>
.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-weight:600}
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:12px}
.d{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;font-weight:600}
.c{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px}
.g{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;font-weight:600;fill:#7d8590}
.n{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;fill:#7d8590}
.k{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:12px;fill:#57606a}
.e{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-linejoin:round}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0.5,1 L9.5,5 L0.5,9 z" fill="#8b949e"/></marker></defs>
<rect x="16" y="194" width="200" height="192" rx="10" fill="none" stroke="#8b949e"/>
<text x="28" y="211" class="g" text-anchor="start">api</text>
<rect x="232" y="194" width="312" height="192" rx="10" fill="none" stroke="#8b949e"/>
<text x="244" y="211" class="g" text-anchor="start">worker</text>
<path d="M280,78 V96" class="e" marker-end="url(#arrow)"/>
<path d="M196,126 C150,128 138,86 178,82 C206,80 224,96 236,110" class="e" marker-end="url(#arrow)"/>
<path d="M280,156 L280,168 Q280,176 272,176 L124,176 Q116,176 116,184 L116,236" class="e" marker-end="url(#arrow)"/>
<path d="M280,156 L280,168 Q280,176 288,176 L312,176 Q320,176 320,184 L320,220" class="e" marker-end="url(#arrow)"/>
<path d="M116,280 V316" class="e" marker-end="url(#arrow)"/>
<path d="M395,248 H424" class="e" marker-end="url(#arrow)"/>
<path d="M320,276 V302" class="e" marker-end="url(#arrow)"/>
<path d="M392,324 H424" class="e" marker-end="url(#arrow)"/>
<rect x="185" y="46" width="190" height="32" rx="16" fill="#f1efeb" stroke="#66625a" stroke-width="1.5"/>
<text x="280" y="67" class="t" font-size="13.5" text-anchor="middle" fill="#66625a">docker compose up</text>
<polygon points="280,96 365,126 280,156 195,126" fill="#e4f3e8" stroke="#236746" stroke-width="1.5" stroke-linejoin="round"/>
<text x="280" y="122.5" class="d" text-anchor="middle" fill="#236746">postgres</text>
<text x="280" y="138.5" class="d" text-anchor="middle" fill="#236746">ready?</text>
<rect x="53.1" y="99.5" width="89.9" height="17" rx="2" fill="#eff1f3"/>
<text x="98.1" y="112" class="k" text-anchor="middle">no, every 5 s</text>
<rect x="288.4" y="159.5" width="26.9" height="17" rx="2" fill="#eff1f3"/>
<text x="301.9" y="172" class="k" text-anchor="middle">yes</text>
<rect x="30" y="236" width="172" height="44" rx="5" fill="#eaf1fc" stroke="#345e91" stroke-width="1.5"/>
<text x="116" y="256" class="t" font-size="14" text-anchor="middle" fill="#345e91">SQL migrations</text>
<text x="116" y="271" class="s" text-anchor="middle" fill="#345e91">under an advisory lock</text>
<rect x="41" y="316" width="150" height="34" rx="17" fill="#f1efeb" stroke="#66625a" stroke-width="1.5"/>
<text x="116" y="338" class="t" font-size="13.5" text-anchor="middle" fill="#66625a">serving /api</text>
<polygon points="320,220 395,248 320,276 245,248" fill="#e4f3e8" stroke="#236746" stroke-width="1.5" stroke-linejoin="round"/>
<text x="320" y="244.5" class="d" text-anchor="middle" fill="#236746">worker lock</text>
<text x="320" y="260.5" class="d" text-anchor="middle" fill="#236746">free?</text>
<rect x="399.7" y="227.5" width="20.6" height="17" rx="2" fill="#eff1f3"/>
<text x="410" y="240" class="k" text-anchor="middle">no</text>
<rect x="424" y="230" width="112" height="36" rx="18" fill="#f1efeb" stroke="#66625a" stroke-width="1.5"/>
<text x="480" y="246" class="t" font-size="13.5" text-anchor="middle" fill="#66625a">exit</text>
<text x="480" y="261" class="s" text-anchor="middle" fill="#66625a">lock is taken</text>
<rect x="328.4" y="280.5" width="26.9" height="17" rx="2" fill="#eff1f3"/>
<text x="341.9" y="293" class="k" text-anchor="middle">yes</text>
<rect x="248" y="302" width="144" height="44" rx="5" fill="#eaf1fc" stroke="#345e91" stroke-width="1.5"/>
<text x="320" y="322" class="t" font-size="14" text-anchor="middle" fill="#345e91">resume imports</text>
<text x="320" y="337" class="s" text-anchor="middle" fill="#345e91">a restart cut off</text>
<rect x="424" y="307" width="112" height="34" rx="17" fill="#f1efeb" stroke="#66625a" stroke-width="1.5"/>
<text x="480" y="329" class="t" font-size="13.5" text-anchor="middle" fill="#66625a">worker loop</text>
</svg>
