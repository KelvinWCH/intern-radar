<svg xmlns="http://www.w3.org/2000/svg" width="560" height="356" viewBox="0 38 560 356" role="img" aria-labelledby="title desc">
<title id="title">Components</title>
<desc id="desc">The Angular app calls the api over REST. The api holds jobs and profile, tailoring runs, and scrape control; the worker holds the scheduler and match scoring. They never call each other: both spawn importers, one process per source, and everything shares PostgreSQL. Tailoring calls an OpenAI compatible LLM API, and match scoring can use an optional GPU embedder.</desc>
