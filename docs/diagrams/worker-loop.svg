<path d="M452.9,276.1 A178,110 0 0 1 340,353.6" class="e" marker-end="url(#arrow)"/>
<path d="M218.6,353.3 A178,110 0 0 1 105.5,271.6" class="e" marker-end="url(#arrow)"/>
<path d="M106,226.9 A178,110 0 0 1 219.3,146.6" class="e" marker-end="url(#arrow)"/>
<path d="M280,332 V273.5" class="e" marker-end="url(#arrow)"/>
<path d="M280,228 V171.5" class="e" marker-end="url(#arrow)"/>
<path d="M243,124 C222,120 205,108 207,88" class="e" marker-end="url(#arrow)"/>
<path d="M353,88 C355,108 338,120 317,124" class="e" marker-end="url(#arrow)"/>
<polygon points="280,110 355,140 280,170 205,140" fill="#e4f3e8" stroke="#236746" stroke-width="1.5" stroke-linejoin="round"/>
<text x="280" y="136.5" class="d" text-anchor="middle" fill="#236746">a group</text>
<text x="280" y="152.5" class="d" text-anchor="middle" fill="#236746">due?</text>
<rect x="383" y="227" width="150" height="46" rx="5" fill="#eaf1fc" stroke="#345e91" stroke-width="1.5"/>
<text x="458" y="248" class="t" font-size="14" text-anchor="middle" fill="#345e91">run importers</text>
<text x="458" y="263" class="s" text-anchor="middle" fill="#345e91">2 or 3 at a time</text>
<polygon points="280,332 355,360 280,388 205,360" fill="#e4f3e8" stroke="#236746" stroke-width="1.5" stroke-linejoin="round"/>
<text x="280" y="356.5" class="d" text-anchor="middle" fill="#236746">internet</text>
<text x="280" y="372.5" class="d" text-anchor="middle" fill="#236746">down?</text>
<rect x="27" y="230" width="150" height="40" rx="5" fill="#f1efeb" stroke="#66625a" stroke-width="1.5"/>
<text x="102" y="255" class="t" font-size="14" text-anchor="middle" fill="#66625a">schedule next run</text>
<rect x="212" y="228" width="136" height="44" rx="5" fill="#f1efeb" stroke="#66625a" stroke-width="1.5"/>
<text x="280" y="248" class="t" font-size="14" text-anchor="middle" fill="#66625a">retry the group</text>
<text x="280" y="263" class="s" text-anchor="middle" fill="#66625a">in 15 minutes</text>
<rect x="195" y="46" width="170" height="40" rx="5" fill="#eaf1fc" stroke="#345e91" stroke-width="1.5"/>
<text x="280" y="64" class="t" font-size="14" text-anchor="middle" fill="#345e91">score new matches</text>
<text x="280" y="79" class="s" text-anchor="middle" fill="#345e91">then wait up to 30 s</text>
<rect x="413.7" y="161.8" width="26.9" height="17" rx="2" fill="#eff1f3"/>
<text x="427.1" y="174.3" class="k" text-anchor="middle">yes</text>
<rect x="122.6" y="321.2" width="20.6" height="17" rx="2" fill="#eff1f3"/>
<text x="132.9" y="333.7" class="k" text-anchor="middle">no</text>
<rect x="288.4" y="294.5" width="26.9" height="17" rx="2" fill="#eff1f3"/>
<text x="301.9" y="307" class="k" text-anchor="middle">yes</text>
<rect x="144.8" y="103.5" width="52.1" height="17" rx="2" fill="#eff1f3"/>
<text x="170.9" y="116" class="k" text-anchor="middle">not yet</text>
</svg>
