<svg xmlns="http://www.w3.org/2000/svg" width="560" height="356" viewBox="0 38 560 356" role="img" aria-labelledby="title desc">
<title id="title">Containers</title>
<desc id="desc">Docker Compose runs web (nginx and the Angular build, published on port 80), api (FastAPI, only on 127.0.0.1:8000), worker, and postgres 18 (only on 127.0.0.1:5432). The api and worker share the job-data volume, postgres keeps its data in postgres-data, and the GPU overlay adds an embedder on port 8100 that the worker calls.</desc>
