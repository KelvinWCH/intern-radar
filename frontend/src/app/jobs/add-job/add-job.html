<header>
  <h2>Add a job</h2>
</header>
<section class="entry-panel">
  @if (saved(); as job) {
    <div class="saved-message">
      <strong>Job saved in your workspace</strong>
      <p>{{ job.title }} at {{ job.company }}</p>
      <p><app-posted-date [timestamp]="job.details?.date_posted" /></p>
      <app-source-badge [source]="job.sourceType" />
      <p>Existing matches keep their saved details.</p>
      <a [routerLink]="['/jobs', job.id]">Review or edit this job</a>
    </div>
  }
  <form #jobForm="ngForm" (ngSubmit)="jobForm.valid && save()">
    <fieldset [disabled]="saving()">
      <app-job-fields [draft]="draft" />
    </fieldset>
    @if (error()) {
      <p class="error-message">{{ error() }}</p>
    }
    <button class="button-primary" type="submit" [disabled]="!canSave() || jobForm.invalid">
      {{ saving() ? 'Saving job...' : 'Save job' }}
    </button>
  </form>
</section>
