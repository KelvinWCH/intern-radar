@switch (kind()) {
  @case ('plane') {
    <div class="visitor plane-pass">
      <div class="contrail"></div>
      <svg viewBox="0 0 160 70">
        <path
          class="plane-body"
          d="m7 35 9-3L7 10l10 1 24 20 83-3c13 0 25 5 29 10-3 5-14 6-27 6H32L9 48l-7-3 17-7Z"
        />
        <path class="plane-wing" d="m80 34-24-27 12-1 42 29-5 6-25 23-12-1 12-22Z" />
        <path class="plane-windows" d="M48 34h4m7 0h4m7 0h4m7 0h4m7 0h4m7 0h4m7 0h4m7 0 7 1" />
      </svg>
    </div>
  }
  @case ('fish') {
    <div class="visitor fish-school">
      @for (fish of flock; track fish) {
        <svg class="swimming-fish" viewBox="0 0 100 50" [style.--fish]="fish">
          <path class="fish-tail" d="M24 25 3 9l3 17-3 15Z" />
          <path class="fish-body" d="M19 25C39 1 67 5 84 25 67 46 39 49 19 25Z" />
          <path class="fish-fin" d="m42 12 14-9 8 10m-20 24 11 9 8-9" />
          <path class="fish-gill" d="M66 17q-8 9 0 17" />
          <circle class="fish-eye" cx="73" cy="23" r="1.6" />
        </svg>
      }
    </div>
  }
  @case ('balloon') {
    <svg class="visitor balloon-pass" viewBox="0 0 90 130">
      <path class="balloon-envelope" d="M45 5C8 5 2 36 16 56l19 29h20l19-29C88 36 82 5 45 5Z" />
      <path class="balloon-panel" d="M45 5C25 14 23 43 38 85h14C67 43 65 14 45 5Z" />
      <path class="balloon-ropes" d="m35 85 4 15m16-15-4 15" />
      <path class="balloon-basket" d="M36 100h18l-3 14H39Z" />
    </svg>
  }
}
