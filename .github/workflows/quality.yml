name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Formatting
        run: npm run format:check
      - name: Production build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false

  backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      # throwaway db so the real postgres tests run too
      # data lives in a capped tmpfs, so no docker volume is written to the runner disk
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: intern_radar
          POSTGRES_PASSWORD: intern-radar
          POSTGRES_DB: intern_radar_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:size=1g
          --health-cmd "pg_isready -U intern_radar -d intern_radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JOB_TEST_DATABASE_URL: postgresql://intern_radar:intern-radar@localhost:5432/intern_radar_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check . ../scripts
      - name: Formatting
        run: python -m ruff format --check . ../scripts
      - name: Type check
        run: python -m pyright
      - name: Test
        run: python -m pytest
