name: intern-radar

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: intern_radar
      POSTGRES_USER: intern_radar
      POSTGRES_PASSWORD: ${JOB_POSTGRES_PASSWORD:?Set JOB_POSTGRES_PASSWORD in backend/.env}
    volumes:
      # postgres 18 keeps its data in /var/lib/postgresql/18/docker
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intern_radar -d intern_radar"]
      interval: 5s
      retries: 12

  worker: &backend
    build: .
    image: intern-radar-backend:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      JOB_DATA_DIR: /data
      JOB_DATABASE_URL: postgresql://intern_radar:${JOB_POSTGRES_PASSWORD}@postgres:5432/intern_radar
      JOB_WORKER_CONFIG_FILE: /app/worker-schedules.json
      JOB_LATEX_EXECUTABLE: /usr/local/bin/tectonic
      JOB_BROWSER_HEADLESS: "true"
      XDG_CACHE_HOME: /data/.cache
    volumes:
      - job-data:/data
      - ./src/job_backend/scrape/worker/schedules.json:/app/worker-schedules.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    # chromium needs more shared memory and its own seccomp profile
    shm_size: 512mb
    security_opt:
      - seccomp=./docker/chromium-seccomp.json

  api:
    <<: *backend
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["job_backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"

  # the angular app on http://localhost, nginx passes /api to the api container
  web:
    build: ../frontend
    image: intern-radar-web:local
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - api

volumes:
  job-data:
  postgres-data:
